name: Release to PyPI

# Publishes when a `v*` tag is pushed. Uses PyPI Trusted Publishing (OIDC):
# no API token stored anywhere — PyPI trusts this exact repo + workflow +
# environment. One-time setup on PyPI is described in docs/releasing.md.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match pyproject.toml version
        run: |
          pip install tomli
          pkg=$(python -c 'import tomli; print(tomli.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "pyproject.toml says $pkg but the tag is v$tag" >&2
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-music-vault
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
      contents: write   # to attach the files to the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for details."
