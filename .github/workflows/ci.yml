name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Django ${{ matrix.django }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        django: ["4.2", "5.2", "6.0"]
        exclude:
          # Django 4.2 supports Python 3.8–3.12
          - { python: "3.13", django: "4.2" }
          # Django 6.0 requires Python >= 3.12
          - { python: "3.10", django: "6.0" }
          - { python: "3.11", django: "6.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install "Django~=${{ matrix.django }}.0" "requests>=2.28"
      - name: Check for migration drift
        run: python manage.py makemigrations --check --dry-run
        env:
          DB_ENGINE: sqlite3
      - name: Test (SQLite)
        run: python manage.py test music_vault
        env:
          DB_ENGINE: sqlite3

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
