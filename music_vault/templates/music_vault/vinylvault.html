{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VinylVault — Your Music Libraries</title>
<link rel="stylesheet" href="{% static 'music_vault/styles.css' %}">
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand"><span class="logo" aria-hidden="true"></span>VinylVault</div>
    <button class="nav-item" data-nav="home"><span class="nav-ico">⌂</span>Home</button>
    <button class="nav-item" data-nav="favorites"><span class="nav-ico">♥</span>Favorites<span class="count" id="favCount">0</span></button>
    <div class="nav-section">Libraries</div>
    <div class="lib-list" id="libNav"></div>
    <button class="nav-item" id="newLibBtn" style="color:var(--accent)"><span class="nav-ico">＋</span>New library</button>
    <div class="sidebar-foot">
      <button class="foot-btn" id="exportBtn" title="Download all your data as a JSON backup">⭳ Export</button>
      <button class="foot-btn" id="importBtn" title="Restore from a JSON backup">⭱ Import</button>
      <input type="file" id="importFile" accept=".json" hidden>
      <form method="post" action="{% url 'logout' %}" style="display:contents">{% csrf_token %}
        <button class="foot-btn" type="submit" title="Sign out ({{ request.user.username }})">⏻ Logout</button>
      </form>
    </div>
  </nav>

  <main class="main" id="main">
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰ Menu</button>
    <div id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script>window.MV_BASE = "{% url 'music_vault:vault' %}";</script>
<script src="{% static 'music_vault/script.js' %}"></script>
</body>
</html>
