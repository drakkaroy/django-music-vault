<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — VinylVault</title>
<style>
  :root{ --bg:#121212; --panel:#181818; --line:#282828; --text:#fff; --text-dim:#b3b3b3; --accent:#1ed760; }
  *{ box-sizing:border-box; margin:0; }
  body{ min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
        font-family:'Segoe UI',system-ui,sans-serif; }
  .card{ width:min(380px, 92vw); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:36px 32px; }
  .brand{ display:flex; align-items:center; gap:10px; font-size:22px; font-weight:800; margin-bottom:6px; }
  .logo{ width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at center,#000 18%,#333 19%,#111 40%,var(--accent) 41%,#111 42%,#222 60%,#111 61%); }
  .sub{ color:var(--text-dim); font-size:14px; margin-bottom:24px; }
  label{ display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
         color:var(--text-dim); margin:14px 0 6px; }
  input{ width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:#242424;
         color:var(--text); font-size:15px; }
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  button{ width:100%; margin-top:22px; padding:12px; border:0; border-radius:999px; background:var(--accent);
          color:#000; font-size:15px; font-weight:800; cursor:pointer; }
  button:hover{ filter:brightness(1.08); }
  .error{ background:#3a1d1d; border:1px solid #6e2c2c; color:#ffb4b4; border-radius:8px;
          padding:10px 12px; font-size:13px; margin-bottom:8px; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="logo" aria-hidden="true"></span>VinylVault</div>
    <p class="sub">Sign in to open your music vault.</p>
    {% if form.errors %}<div class="error">Wrong username or password — try again.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus autocomplete="username" required>
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
