[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-music-vault"
version = "0.1.0"
description = "Reusable Django app for cataloging your music collection — libraries, albums, tags, favorites and Spotify metadata autofill — with the VinylVault frontend included."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "drakkaroy" }]
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "requests>=2.28",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/drakkaroy/django-music-vault"
Repository = "https://github.com/drakkaroy/django-music-vault"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["music_vault", "music_vault.*"]

[tool.setuptools.package-data]
music_vault = ["templates/**/*", "static/**/*"]
